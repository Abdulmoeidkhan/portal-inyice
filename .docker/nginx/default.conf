server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # Max upload size (GDS file pastes, attachments)
    client_max_body_size 32m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    charset utf-8;

    # Gzip — essential for React + Ant Design bundles (can be 1–2 MB)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Vite-generated assets have content-hash filenames — cache indefinitely
    location /build/ {
        expires max;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # PWA service worker must never be cached by the browser
    location ~* (service-worker\.js|sw\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # PWA manifest — short cache so installs pick up changes
    location ~* (manifest\.webmanifest|manifest\.json)$ {
        add_header Cache-Control "no-cache";
        expires 0;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # All requests fall through to Laravel (handles API + SPA shell via catch-all route)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

services:
  app:
    image: webdevops/php-nginx:8.4-alpine
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      WEB_DOCUMENT_ROOT: /app/public
      WEB_DOCUMENT_INDEX: index.php
      PHP_MEMORY_LIMIT: 512M
      PHP_MAX_EXECUTION_TIME: 120
      PHP_POST_MAX_SIZE: 32M
      PHP_UPLOAD_MAX_FILESIZE: 32M
    command: >
      sh -c "
        set -e;
        mkdir -p storage/app/public storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache;
        chown -R application:application storage bootstrap/cache || true;
        chmod -R ug+rwX storage bootstrap/cache || true;
        php artisan storage:link >/dev/null 2>&1 || true;
        php artisan optimize:clear || true;
        exec supervisord
      "
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.inyice-os.rule=Host(`${APP_DOMAIN:-os.inyice.com}`) || Host(`${APP_WWW_DOMAIN:-www.os.inyice.com}`)
      - traefik.http.routers.inyice-os.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}
      - traefik.http.routers.inyice-os.tls=true
      - traefik.http.routers.inyice-os.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.inyice-os.loadbalancer.server.port=80
    volumes:
      - ./:/app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_net

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_mysql_root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-inyice_os}
      MYSQL_USER: ${DB_USERNAME:-inyice_os}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_inyice_os_db_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "${DB_USERNAME:-inyice_os}", "-p${DB_PASSWORD:-change_me_inyice_os_db_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_net

volumes:
  mysql_data:

networks:
  app_net:
    driver: bridge

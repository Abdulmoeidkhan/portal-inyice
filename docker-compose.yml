x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-inYice OS}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:-}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-https://os.inyice.com}
  APP_URI: ${APP_URI:-https://os.inyice.com/api}
  APP_DOMAIN: ${APP_DOMAIN:-os.inyice.com}
  APP_LOCALE: ${APP_LOCALE:-en}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
  APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-en_US}
  APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER:-file}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_STACK: ${LOG_STACK:-single}
  LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL:-null}
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: ${DB_CONNECTION:-mysql}
  DB_HOST: ${DB_HOST:-mysql}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-inyice_os}
  DB_USERNAME: ${DB_USERNAME:-inyice_os}
  DB_PASSWORD: ${DB_PASSWORD:-change_me_inyice_os_db_password}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
  SESSION_PATH: ${SESSION_PATH:-/}
  SESSION_DOMAIN: ${SESSION_DOMAIN:-os.inyice.com}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
  CACHE_STORE: ${CACHE_STORE:-redis}
  CACHE_PREFIX: ${CACHE_PREFIX:-inyice_os}
  API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
  PUBLIC_API_RATE_LIMIT_PER_MINUTE: ${PUBLIC_API_RATE_LIMIT_PER_MINUTE:-60}
  SENSITIVE_WRITE_RATE_LIMIT_PER_MINUTE: ${SENSITIVE_WRITE_RATE_LIMIT_PER_MINUTE:-30}
  SIGNIN_RATE_LIMIT_PER_MINUTE: ${SIGNIN_RATE_LIMIT_PER_MINUTE:-6}
  SIGNUP_RATE_LIMIT_PER_MINUTE: ${SIGNUP_RATE_LIMIT_PER_MINUTE:-5}
  RATE_LIMITER_USE_REDIS: ${RATE_LIMITER_USE_REDIS:-true}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
  REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  REDIS_PORT: ${REDIS_PORT:-6379}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-os.inyice.com}
  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_SCHEME: ${MAIL_SCHEME:-null}
  MAIL_HOST: ${MAIL_HOST:-smtp.hostinger.com}
  MAIL_PORT: ${MAIL_PORT:-465}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-ssl}
  MAIL_USERNAME: ${MAIL_USERNAME:-no-reply@inyice.com}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-change_me_hostinger_mail_password}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@inyice.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-inYice OS}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  AWS_BUCKET: ${AWS_BUCKET:-}
  AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}
  VITE_APP_NAME: ${VITE_APP_NAME:-inYice OS}
  VITE_APP_URL: ${VITE_APP_URL:-https://os.inyice.com}
  WAIT_FOR_DB: ${WAIT_FOR_DB:-true}
  DB_WAIT_RETRIES: ${DB_WAIT_RETRIES:-60}
  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
  CACHE_LARAVEL_CONFIG: ${CACHE_LARAVEL_CONFIG:-true}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: inyice-os-laravel-app:latest
    restart: unless-stopped
    environment: *app-environment
    volumes:
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: inyice-os-nginx:latest
    restart: unless-stopped
    depends_on:
      - app
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.inyice-os.rule=Host(`${APP_DOMAIN:-os.inyice.com}`)
      - traefik.http.routers.inyice-os.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}
      - traefik.http.routers.inyice-os.tls=true
      - traefik.http.routers.inyice-os.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.inyice-os.loadbalancer.server.port=80
    volumes:
      - storage_data:/var/www/html/storage:ro
    networks:
      - app_net

  worker:
    image: inyice-os-laravel-app:latest
    restart: unless-stopped
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: ${WORKER_RUN_MIGRATIONS:-false}
      CACHE_LARAVEL_CONFIG: ${WORKER_CACHE_LARAVEL_CONFIG:-false}
    command: sh -c "php artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-time=3600"
    volumes:
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net

  scheduler:
    image: inyice-os-laravel-app:latest
    restart: unless-stopped
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: ${SCHEDULER_RUN_MIGRATIONS:-false}
      CACHE_LARAVEL_CONFIG: ${SCHEDULER_CACHE_LARAVEL_CONFIG:-false}
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # mysql_native_password plugin removed in 8.4; caching_sha2_password is default and works with PHP mysqlnd
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_mysql_root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-inyice_os}
      MYSQL_USER: ${DB_USERNAME:-inyice_os}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_inyice_os_db_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "${DB_USERNAME:-inyice_os}", "-p${DB_PASSWORD:-change_me_inyice_os_db_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

volumes:
  mysql_data:
  storage_data:
  bootstrap_cache:

networks:
  app_net:
    driver: bridge

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: inyice-os-laravel-app:latest
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    volumes:
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: inyice-os-nginx:latest
    restart: unless-stopped
    depends_on:
      - app
    expose:
      - "80"
    volumes:
      - storage_data:/var/www/html/storage:ro
    networks:
      - app_net

  worker:
    image: inyice-os-laravel-app:latest
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    command: sh -c "php artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-time=3600"
    volumes:
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net

  scheduler:
    image: inyice-os-laravel-app:latest
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # mysql_native_password plugin removed in 8.4; caching_sha2_password is default and works with PHP mysqlnd
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-inyice_os}
      MYSQL_USER: ${DB_USERNAME:-inyice_os}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "${DB_USERNAME:-inyice_os}", "-p${DB_PASSWORD:-change_me}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

volumes:
  mysql_data:
  storage_data:
  bootstrap_cache:

networks:
  app_net:
    driver: bridge

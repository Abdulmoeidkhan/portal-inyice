services:
  app:
    volumes:
      - ./:/var/www/html

  web:
    ports:
      - "${APP_HTTP_PORT:-8081}:80"
    volumes:
      - ./:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  worker:
    volumes:
      - ./:/var/www/html

  scheduler:
    volumes:
      - ./:/var/www/html

  mysql:
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
